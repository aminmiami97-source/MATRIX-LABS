name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'supabase/**'
      - '.env.example'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'index.html'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install frontend dependencies
        run: npm install
      - name: Generate Windows icon assets
        run: |
          npm install --no-save sharp
          node --input-type=module -e "import sharp from 'sharp'; await sharp('src-tauri/icons/icon-source.svg').resize(1024, 1024).png().toFile('src-tauri/icons/icon-generated.png')"
          npx tauri icon src-tauri/icons/icon-generated.png --output src-tauri/icons
      - name: Build MATRIX LABS
        run: npm run tauri:build
        env:
          VITE_SUPABASE_URL: https://ndpgjqowvqabozvfgeab.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_mEiLwO1VIKnBUEs8NVD2uw_sdYYbrsN
      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: MATRIX-LABS-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: MATRIX LABS ${{ github.ref_name }}
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/*.exe
