name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'supabase/**'
      - '.env.example'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'index.html'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to publish after the Windows installer builds (for example v7.2.0)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install frontend dependencies
        run: npm install
      - name: Generate Windows icon assets
        run: |
          npm install --no-save sharp
          node --input-type=module -e "import sharp from 'sharp'; await sharp('src-tauri/icons/icon-source.svg').resize(1024, 1024).png().toFile('src-tauri/icons/icon-generated.png')"
          npx tauri icon src-tauri/icons/icon-generated.png --output src-tauri/icons
      - name: Build signed MATRIX LABS updater
        run: npm run tauri:build
        env:
          VITE_SUPABASE_URL: https://ndpgjqowvqabozvfgeab.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_mEiLwO1VIKnBUEs8NVD2uw_sdYYbrsN
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Create updater manifest
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ inputs.release_tag || '' }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "v$version" }
          $tag = $tag.Trim()
          if (-not $tag.StartsWith("v")) { $tag = "v$tag" }
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated." }
          $signaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path $signaturePath)) { throw "Updater signature was not generated. Check the TAURI_SIGNING_PRIVATE_KEY GitHub secret." }
          $signature = (Get-Content $signaturePath -Raw).Trim()
          $downloadUrl = "https://github.com/aminmiami97-source/MATRIX-LABS/releases/download/$tag/$($installer.Name)"
          $manifest = @{
            version = $version
            notes = "MATRIX LABS $tag"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = $downloadUrl
              }
            }
          } | ConvertTo-Json -Depth 6
          Set-Content -Path "src-tauri/target/release/bundle/nsis/latest.json" -Value $manifest -Encoding utf8
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: MATRIX-LABS-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          name: MATRIX LABS ${{ inputs.release_tag || github.ref_name }}
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: main
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
