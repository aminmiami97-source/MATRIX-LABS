name: Deploy MATRIX LITE to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "matrix-lite/**"
      - ".github/workflows/matrix-lite-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "matrix-lite-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload MATRIX LITE site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "matrix-lite"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
