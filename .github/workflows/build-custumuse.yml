name: Build MATRIX Custumuse

on:
  push:
    branches:
      - custumuse-v0.1.0
    paths:
      - "apps/MATRIX-Custumuse/**"
      - ".github/workflows/build-custumuse.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 executable
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained executable
        shell: pwsh
        run: |
          dotnet publish "apps/MATRIX-Custumuse/MATRIXCustumuse/MATRIXCustumuse.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o "artifacts/publish"
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE" }
          Compress-Archive -Path "artifacts/publish/*" -DestinationPath "artifacts/MATRIX-Custumuse-v0.3.0-win-x64.zip" -CompressionLevel Optimal -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-Custumuse-v0.3.0-win-x64
          path: artifacts/MATRIX-Custumuse-v0.3.0-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custumuse-v0.3.0
          target_commitish: ${{ github.sha }}
          name: MATRIX Custumuse v0.3.0 Preview
          body: |
            First independent MATRIX Glass Engine experiment.

            No TranslucentTB dependency. Custumuse calls the Windows DWM system-backdrop API directly for the Explorer-owned taskbar window. This is experimental because Microsoft does not provide a dedicated public API for third-party taskbar styling. It may be rejected or ignored by some Windows builds.

            The effect is reversible: the original backdrop type is saved before applying, and Restore original writes the saved value back. No administrator permission or Explorer injection is used.
          files: artifacts/MATRIX-Custumuse-v0.3.0-win-x64.zip
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
