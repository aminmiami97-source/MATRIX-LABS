name: Build MATRIX Custumuse

on:
  push:
    branches:
      - custumuse-v0.1.0
    paths:
      - "apps/MATRIX-Custumuse/**"
      - ".github/workflows/build-custumuse.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows architecture packages
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish x64, x86 and ARM64 packages
        shell: pwsh
        run: |
          $targets = @("win-x64", "win-x86", "win-arm64")
          foreach ($rid in $targets) {
            $publishPath = "artifacts/publish/$rid"
            $zipPath = "artifacts/MATRIX-Custumuse-v0.3.1-$rid.zip"
            dotnet publish "apps/MATRIX-Custumuse/MATRIXCustumuse/MATRIXCustumuse.csproj" -c Release -r $rid --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o $publishPath
            if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed for $rid with exit code $LASTEXITCODE" }
            Compress-Archive -Path "$publishPath/*" -DestinationPath $zipPath -CompressionLevel Optimal -Force
          }

      - name: Upload all Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-Custumuse-v0.3.1-windows
          path: artifacts/MATRIX-Custumuse-v0.3.1-win-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custumuse-v0.3.1
          target_commitish: ${{ github.sha }}
          name: MATRIX Custumuse v0.3.1 Preview
          body: |
            Expanded Windows PC support and proper taskbar diagnostics.

            Separate self-contained builds are included for x64, x86 and ARM64. The app includes per-monitor DPI awareness and diagnoses primary/secondary taskbar windows, display identity, and taskbar orientation.

            DWM Desktop Acrylic requests still require Windows 11 build 22621 or later. Applying the DWM system-backdrop attribute to Explorer's taskbar is experimental because Microsoft does not provide a dedicated public taskbar styling API.
          files: |
            artifacts/MATRIX-Custumuse-v0.3.1-win-x64.zip
            artifacts/MATRIX-Custumuse-v0.3.1-win-x86.zip
            artifacts/MATRIX-Custumuse-v0.3.1-win-arm64.zip
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
