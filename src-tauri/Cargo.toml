[package]
name = "matrix-labs"
version = "8.0.2"
description = "Personal AI agents for Windows, designed around user control."
authors = ["MATRIX LABS"]
edition = "2021"

[lib]
name = "matrix_labs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1"
